apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goalixa-admin
  namespace: goalixa-admin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - admin.goalixa.com
    secretName: admin-tls
  rules:
  - host: admin.goalixa.com
    http:
      paths:
      - path: /admin/api
        pathType: Prefix
        backend:
          service:
            name: goalixa-admin
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: goalixa-admin-frontend
            port:
              number: 80
