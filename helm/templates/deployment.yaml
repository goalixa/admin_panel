apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        env:
        - name: AUTH_SERVICE_URL
          value: "{{ .Values.env.AUTH_SERVICE_URL }}"
        - name: CORE_API_URL
          value: "{{ .Values.env.CORE_API_URL }}"
        - name: DATABASE_URL
          value: "{{ .Values.env.DATABASE_URL }}"
        - name: REDIS_URL
          value: "{{ .Values.env.REDIS_URL }}"
        livenessProbe:
          httpGet:
            path: /health
            port: http
        readinessProbe:
          httpGet:
            path: /health
            port: http
        resources:
          {{- toYaml .Values.resources | nindent 10 }}