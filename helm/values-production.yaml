replicaCount: 3

image:
  tag: "production-latest"

frontend:
  replicaCount: 2
  image:
    tag: "production-latest"

ingress:
  host: admin.goalixa.com


env:
  AUTH_SERVICE_URL: http://goalixa-auth:80
  CORE_API_URL: http://goalixa-core-api:80
  DATABASE_URL: postgresql://goalixa:goalixa@goalixa-postgresql:5432/goalixa_admin
  REDIS_URL: redis://goalixa-redis:6379/0

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70